name: Feature request
description: Suggest an improvement for Market Observer
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or maintenance problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the proposed behavior.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Cloudflare Worker
        - D1 migrations
        - LINE commands
        - Recommendation review
        - CLI/tooling
        - Tests
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Additional context
